<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fcfaf6"><title>学習ふりかえりカード | まなびツールBOX</title>
<style>:root{font-family:"Yu Gothic",Meiryo,system-ui,sans-serif;color:#243948;background:#fcfaf6}*{box-sizing:border-box}body{margin:0}main{width:min(740px,calc(100% - 32px));margin:32px auto 80px}a{color:#216276}h1{font-size:clamp(1.6rem,5vw,2.4rem)}.small{color:#647886;line-height:1.8}.card{background:#fff;border:1px solid #e0e9e5;border-radius:20px;padding:clamp(16px,4vw,32px);box-shadow:0 14px 30px #293c3811}.field{margin:20px 0}label{display:block;font-weight:800;margin-bottom:9px}textarea,input,select{font:inherit;width:100%;border:1px solid #becdc8;border-radius:10px;padding:12px;background:white;color:inherit}textarea{min-height:105px;resize:vertical;line-height:1.8}.buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}button{font:inherit;border:0;border-radius:10px;padding:12px 18px;background:#236478;color:#fff;font-weight:800;cursor:pointer}button.alt{background:#e7f1ed;color:#215268}button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #eca260;outline-offset:2px}#status{min-height:1.5em;color:#216276;font-weight:700}#preview{white-space:pre-wrap;line-height:1.9;border:1px dashed #b1cac3;border-radius:12px;padding:18px;background:#f7fbf9;margin-top:14px;overflow-wrap:anywhere}@media print{nav,.buttons,.small,#status{display:none!important}body{background:white}main{margin:0;width:100%}.card{border:0;box-shadow:none}textarea,input,select{border:0}#preview{border:1px solid #ddd}}</style></head>
<body><main><nav><a href="../../../index.html">← まなびツールBOXに戻る</a></nav><h1>📝 学習ふりかえりカード</h1><p class="small">今日の学びを自分の言葉で整理しよう。入力内容はサーバーに送信されず、このページでは自動保存もされません。名前や個人情報は書かないでください。</p><section class="card"><div class="field"><label for="subject">学習した教科</label><select id="subject"><option>国語</option><option>算数</option><option>理科</option><option>社会</option><option>体育</option><option>その他</option></select></div><div class="field"><label for="learned">① 今日、分かったこと</label><textarea id="learned" placeholder="今日の学習で分かったことを書こう"></textarea></div><div class="field"><label for="effort">② がんばったこと・工夫したこと</label><textarea id="effort" placeholder="自分ががんばったことを書こう"></textarea></div><div class="field"><label for="next">③ 次にがんばりたいこと</label><textarea id="next" placeholder="次の目標を書こう"></textarea></div><div class="buttons"><button id="make">カードを作る</button><button class="alt" id="copy">文章をコピー</button><button class="alt" id="print">印刷する</button><button class="alt" id="reset">入力を消す</button></div><p id="status" role="status" aria-live="polite"></p><div id="preview" aria-label="ふりかえりのプレビュー">「カードを作る」を押すと、ここにふりかえりが表示されます。</div></section></main>
<script>const $=x=>document.getElementById(x);function content(){return `【${$('subject').value}のふりかえり】

① 今日、分かったこと
${$('learned').value.trim()||'（まだ書いていません）'}

② がんばったこと・工夫したこと
${$('effort').value.trim()||'（まだ書いていません）'}

③ 次にがんばりたいこと
${$('next').value.trim()||'（まだ書いていません）'}`}function show(){const s=content();$('preview').textContent=s;return s}$('make').onclick=()=>{$('status').textContent='カードを作成しました。';show()};$('copy').onclick=async()=>{const s=show();try{await navigator.clipboard.writeText(s);$('status').textContent='文章をコピーしました。'}catch(e){$('status').textContent='コピーできませんでした。表示された文章を選択してコピーしてください。'}};$('print').onclick=()=>{show();window.print()};$('reset').onclick=()=>{if(confirm('入力した内容をすべて消しますか？')){for(const id of ['learned','effort','next'])$(id).value='';$('preview').textContent='「カードを作る」を押すと、ここにふりかえりが表示されます。';$('status').textContent='入力を消しました。'}};</script></body></html>
